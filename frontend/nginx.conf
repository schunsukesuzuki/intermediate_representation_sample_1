server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS resolves "api" when the backend container appears;
    # nginx can serve the UI even if the backend is not ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend "api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 5s;
        client_max_body_size 1m;
    }
    location /assets/ { expires 1d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
